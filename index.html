<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agenda Movom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f3e9ff;
    padding:20px;
}
h1{
    text-align:center;
    color:#5a2d82;
}
.container{
    background:#fff;
    padding:20px;
    border-radius:12px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}
th{ background:#d6c3ff; }
input,select,button{ padding:5px; }
button{
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.confirmar{ background:#6a5acd; color:#fff; }
.realizada{ background:#2ecc71; color:#fff; }
.vencida{ background:#f8d7da; }
.filtros button{ margin-right:5px; }
.alerta{
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<h1>📅 Agenda Movom</h1>

<div class="alerta" id="alerta" style="display:none">
<strong>⚠️ Reavaliações vencidas:</strong>
<ul id="listaVencidas"></ul>
</div>

<div class="filtros">
<button onclick="filtro='todos'">Todos</button>
<button onclick="filtro='pendentes'">Pendentes</button>
<button onclick="filtro='realizadas'">Realizadas</button>
</div>

<div class="container">
<table>
<thead>
<tr>
<th>Nome</th>
<th>Tipo</th>
<th>Data</th>
<th>Horário</th>
<th>Reavaliação</th>
<th>Plano</th>
<th>✔️</th>
<th>🗑️</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<br>
<button onclick="adicionar()">➕ Adicionar Aluno</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, push, set, onValue, update, remove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDQvA6XiiwiyMrh0xjdy5s4QNjXwIgQoh4",
  authDomain: "agendamovom.firebaseapp.com",
  databaseURL: "https://agendamovom-default-rtdb.firebaseio.com",
  projectId: "agendamovom",
  storageBucket: "agendamovom.appspot.com",
  messagingSenderId: "919577291328",
  appId: "1:919577291328:web:65f5937da45903598ccda5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const alunosRef = ref(db,"alunos");

const tabela = document.getElementById("tabela");
const alerta = document.getElementById("alerta");
const listaVencidas = document.getElementById("listaVencidas");

let cache = {};
let filtro = "todos";

/* 🛠 FUNÇÕES */
function hojeISO(){
    return new Date().toISOString().split("T")[0];
}

function calcReavaliacao(data){
    const d = new Date(data);
    d.setMonth(d.getMonth()+3);
    return d.toISOString().split("T")[0];
}

function br(data){
    if(!data) return "";
    const [y,m,d] = data.split("-");
    return `${d}/${m}/${y}`;
}

/* ➕ ADICIONAR */
window.adicionar = () => {
    const novo = push(alunosRef);
    set(novo,{
        nome:"",
        tipo:"Avaliação",
        dataAvaliacao: hojeISO(),
        horario:"",
        dataReavaliacao: calcReavaliacao(hojeISO()),
        plano:"Mensal",
        realizada:false
    });
};

/* ✔️ CONFIRMAR */
window.confirmar = (id, atual) => {
    update(ref(db,`alunos/${id}`),{
        realizada: !atual
    });
};

/* 🗑️ EXCLUIR */
window.excluir = id => {
    if(confirm("Excluir aluno?")){
        remove(ref(db,`alunos/${id}`));
    }
};

/* 🔄 RENDER */
onValue(alunosRef,snapshot=>{
    cache = snapshot.val() || {};
    tabela.innerHTML="";
    listaVencidas.innerHTML="";
    alerta.style.display="none";

    const hoje = hojeISO();

    Object.entries(cache).forEach(([id,d])=>{
        const vencida = d.dataReavaliacao < hoje && !d.realizada;

        if(vencida){
            alerta.style.display="block";
            const li=document.createElement("li");
            li.textContent = `${d.nome || "Sem nome"} – ${br(d.dataReavaliacao)}`;
            listaVencidas.appendChild(li);
        }

        if(filtro==="pendentes" && d.realizada) return;
        if(filtro==="realizadas" && !d.realizada) return;

        const tr=document.createElement("tr");
        if(vencida) tr.classList.add("vencida");

        tr.innerHTML=`
<td><input value="${d.nome}" onchange="update(ref(db,'alunos/${id}'),{nome:this.value})"></td>

<td>
<select onchange="update(ref(db,'alunos/${id}'),{tipo:this.value})">
<option ${d.tipo==="Avaliação"?"selected":""}>Avaliação</option>
<option ${d.tipo==="Aula"?"selected":""}>Aula</option>
</select>
</td>

<td>
<input type="date" value="${d.dataAvaliacao}"
onchange="update(ref(db,'alunos/${id}'),{
dataAvaliacao:this.value,
dataReavaliacao:'${calcReavaliacao(d.dataAvaliacao)}'
})">
</td>

<td><input type="time" value="${d.horario}"
onchange="update(ref(db,'alunos/${id}'),{horario:this.value})"></td>

<td>${br(d.dataReavaliacao)}</td>

<td>
<select onchange="update(ref(db,'alunos/${id}'),{plano:this.value})">
<option ${d.plano==="Mensal"?"selected":""}>Mensal</option>
<option ${d.plano==="Gympass"?"selected":""}>Gympass</option>
<option ${d.plano==="Totalpass"?"selected":""}>Totalpass</option>
</select>
</td>

<td>
<button class="${d.realizada?'realizada':'confirmar'}"
onclick="confirmar('${id}',${d.realizada})">✔️</button>
</td>

<td><button onclick="excluir('${id}')">🗑️</button></td>
`;

        tabela.appendChild(tr);
    });
});
</script>

</body>
</html>
