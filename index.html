<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agenda Movom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f3e9ff;
    padding:20px;
}
h2{
    text-align:center;
    color:#5b2d8b;
}
.container{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}
th{
    background:#d6c3ff;
}
input,select,button{
    padding:5px;
}
button{
    cursor:pointer;
    border:none;
    border-radius:6px;
}
.confirmar{
    background:#6a5acd;
    color:#fff;
}
.confirmada{
    background:#2ecc71;
    color:#fff;
}
.vencida{
    background:#f8d7da;
}
.realizada{
    background:#d4edda;
}
.alerta{
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}
.filtros{
    margin-bottom:10px;
}
.filtros button{
    margin-right:5px;
}
</style>
</head>

<body>

<h2>📅 Agenda Movom</h2>

<div class="alerta" id="alertaVencidas" style="display:none">
    <strong>⚠️ Reavaliações vencidas:</strong>
    <ul id="listaVencidas"></ul>
</div>

<div class="filtros">
    <button onclick="filtroAtual='todos';render()">Todos</button>
    <button onclick="filtroAtual='pendentes';render()">Pendentes</button>
    <button onclick="filtroAtual='realizadas';render()">Realizadas</button>
</div>

<div class="container">
<table>
<thead>
<tr>
<th>Nome</th>
<th>Tipo</th>
<th>Data</th>
<th>Horário</th>
<th>Reavaliação</th>
<th>Plano</th>
<th>OK</th>
<th>🗑️</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<br>
<button onclick="adicionar()">➕ Adicionar Aluno</button>
</div>

<script>
let cache = JSON.parse(localStorage.getItem("agenda")) || {};
let filtroAtual = "todos";
const tabela = document.getElementById("tabela");

function salvarLocal(){
    localStorage.setItem("agenda", JSON.stringify(cache));
}

function br(data){
    if(!data) return "";
    const [y,m,d] = data.split("-");
    return `${d}/${m}/${y}`;
}

function calcReavaliacao(data){
    const dt = new Date(data);
    dt.setMonth(dt.getMonth()+3);
    return dt.toISOString().split("T")[0];
}

function hojeISO(){
    return new Date().toISOString().split("T")[0];
}

function adicionar(){
    const id = Date.now();
    cache[id] = {
        nome:"",
        tipo:"Avaliação",
        dataAvaliacao:hojeISO(),
        horario:"",
        dataReavaliacao:calcReavaliacao(hojeISO()),
        plano:"Mensal",
        avaliacaoRealizada:false
    };
    salvarLocal();
    render();
}

function salvar(id,campo,valor){
    cache[id][campo]=valor;
    if(campo==="dataAvaliacao"){
        cache[id].dataReavaliacao = calcReavaliacao(valor);
    }
    salvarLocal();
    render();
}

function confirmar(id){
    cache[id].avaliacaoRealizada = !cache[id].avaliacaoRealizada;
    salvarLocal();
    render();
}

function excluir(id){
    if(confirm("Excluir aluno?")){
        delete cache[id];
        salvarLocal();
        render();
    }
}

function render(){
    tabela.innerHTML="";
    const hoje = hojeISO();
    const alertaBox = document.getElementById("alertaVencidas");
    const lista = document.getElementById("listaVencidas");
    lista.innerHTML="";
    let temVencidas=false;

    Object.entries(cache).forEach(([id,d])=>{
        const realizada = d.avaliacaoRealizada;
        const vencida = d.dataReavaliacao < hoje && !realizada;

        if(vencida){
            temVencidas=true;
            const li=document.createElement("li");
            li.textContent=`${d.nome || "Sem nome"} – ${br(d.dataReavaliacao)}`;
            lista.appendChild(li);
        }

        if(filtroAtual==="pendentes" && realizada) return;
        if(filtroAtual==="realizadas" && !realizada) return;

        const tr=document.createElement("tr");
        if(vencida) tr.classList.add("vencida");
        if(realizada) tr.classList.add("realizada");

        tr.innerHTML=`
<td><input value="${d.nome}" onchange="salvar('${id}','nome',this.value)"></td>

<td>
<select onchange="salvar('${id}','tipo',this.value)">
<option ${d.tipo==="Avaliação"?"selected":""}>Avaliação</option>
<option ${d.tipo==="Aula"?"selected":""}>Aula</option>
</select>
</td>

<td><input type="date" value="${d.dataAvaliacao}" onchange="salvar('${id}','dataAvaliacao',this.value)"></td>

<td><input type="time" value="${d.horario}" onchange="salvar('${id}','horario',this.value)"></td>

<td>${br(d.dataReavaliacao)}</td>

<td>
<select onchange="salvar('${id}','plano',this.value)">
<option ${d.plano==="Mensal"?"selected":""}>Mensal</option>
<option ${d.plano==="Gympass"?"selected":""}>Gympass</option>
<option ${d.plano==="Totalpass"?"selected":""}>Totalpass</option>
</select>
</td>

<td>
<button class="${realizada?"confirmada":"confirmar"}" onclick="confirmar('${id}')">
${realizada?"✔️":"✔️"}
</button>
</td>

<td><button onclick="excluir('${id}')">🗑️</button></td>
`;
        tabela.appendChild(tr);
    });

    alertaBox.style.display = temVencidas ? "block" : "none";
}

render();
</script>

</body>
</html>
