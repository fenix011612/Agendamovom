<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agenda Movom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3e9ff;
    padding: 20px;
}
h1, h2 {
    text-align: center;
    color: #5a2d82;
}
.container {
    max-width: 1200px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 30px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: center;
}
th {
    background: #cdb4f5;
}
.vencida {
    background: #ffd6d6;
}
.vencendo {
    background: #fff3cd;
}
.hoje {
    background: #ffe066;
}
.realizada {
    background: #d4edda;
}
input, select {
    width: 100%;
    padding: 5px;
}
button {
    padding: 6px 10px;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
.confirmar {
    background: #6f42c1;
}
.confirmada {
    background: #28a745;
}
.ok {
    background: #28a745;
}
</style>
</head>

<body>

<h1>Agenda de Avaliações</h1>

<div class="container">
<h2>📅 Agenda em dia</h2>
<table>
<thead>
<tr>
<th>Nome</th>
<th>Tipo</th>
<th>Data</th>
<th>Horário</th>
<th>Reavaliação</th>
<th>Plano</th>
<th>✔️</th>
<th>🗑️</th>
</tr>
</thead>
<tbody id="tabelaAlunos"></tbody>
</table>
<button onclick="adicionarAluno()">➕ Adicionar Aluno</button>
</div>

<div class="container">
<h2>⚠️ Reavaliações vencidas</h2>
<table>
<thead>
<tr>
<th>Nome</th>
<th>Última Avaliação</th>
<th>Nova Data</th>
<th>Horário</th>
<th>OK</th>
</tr>
</thead>
<tbody id="vencidas"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, push, set, onValue, update, remove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDQvA6XiiwiyMrh0xjdy5s4QNjXwIgQoh4",
  authDomain: "agendamovom.firebaseapp.com",
  projectId: "agendamovom",
  storageBucket: "agendamovom.firebasestorage.app",
  messagingSenderId: "919577291328",
  appId: "1:919577291328:web:65f5937da45903598ccda5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const alunosRef = ref(db, "alunos");

const tabelaAlunos = document.getElementById("tabelaAlunos");
const vencidas = document.getElementById("vencidas");

/* UTIL */
const hojeISO = () => new Date().toISOString().split("T")[0];

const br = (data) => {
    if (!data) return "";
    const [y, m, d] = data.split("-");
    return `${d}/${m}/${y}`;
};

const calcReavaliacao = (data) => {
    const d = new Date(data + "T00:00");
    d.setMonth(d.getMonth() + 3);
    return d.toISOString().split("T")[0];
};

/* RENDER */
onValue(alunosRef, snapshot => {
    tabelaAlunos.innerHTML = "";
    vencidas.innerHTML = "";

    const alunos = snapshot.val() || {};
    const hoje = new Date();

    Object.entries(alunos).forEach(([id, d]) => {
        const realizada = d.avaliacaoRealizada === true;
        const dataReav = d.dataReavaliacao ? new Date(d.dataReavaliacao) : null;
        const diff = dataReav ? Math.ceil((dataReav - hoje) / 86400000) : null;
        const vencida = diff !== null && diff < 0;

        if (!vencida) {
            const tr = document.createElement("tr");
            if (realizada) tr.classList.add("realizada");

            tr.innerHTML = `
<td><input value="${d.nome || ""}"></td>
<td>
<select>
<option ${d.tipo==="Avaliação"?"selected":""}>Avaliação</option>
<option ${d.tipo==="Aula"?"selected":""}>Aula</option>
</select>
</td>
<td><input type="date" value="${d.dataAvaliacao || ""}"></td>
<td><input type="time" value="${d.horario || ""}"></td>
<td>${br(d.dataReavaliacao)}</td>
<td>
<select>
<option ${d.plano==="Mensal"?"selected":""}>Mensal</option>
<option ${d.plano==="Gympass"?"selected":""}>Gympass</option>
<option ${d.plano==="Totalpass"?"selected":""}>Totalpass</option>
</select>
</td>
<td>
<button class="${realizada ? "confirmada" : "confirmar"}">✔️</button>
</td>
<td><button onclick="excluir('${id}')">🗑️</button></td>
`;

            const campos = tr.querySelectorAll("input, select");
            const btn = tr.querySelector("button");

            btn.onclick = () => {
                if (!confirm("Essa avaliação foi realizada?")) return;

                const data = campos[2].value || hojeISO();

                update(ref(db, `alunos/${id}`), {
                    nome: campos[0].value,
                    tipo: campos[1].value,
                    dataAvaliacao: data,
                    horario: campos[3].value,
                    dataReavaliacao: calcReavaliacao(data),
                    plano: campos[4].value,
                    avaliacaoRealizada: true
                });
            };

            tabelaAlunos.appendChild(tr);
        }
    });
});

/* EXCLUIR */
window.excluir = (id) => {
    if (confirm("Excluir aluno?")) {
        remove(ref(db, `alunos/${id}`));
    }
};

/* ADD */
window.adicionarAluno = () => {
    set(push(alunosRef), {
        nome: "",
        tipo: "Avaliação",
        dataAvaliacao: "",
        horario: "",
        dataReavaliacao: "",
        plano: "Mensal",
        avaliacaoRealizada: false
    });
};
</script>

</body>
</html>
